version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PORT=${PORT:-3000}
      - HIVE_DB_PATH=${HIVE_DB_PATH:-./.hive/hive.sqlite}
    volumes:
      - hive-data:/app/.hive
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

volumes:
  hive-data:

networks:
  app-network:
    driver: bridge