<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HERMES-HIVE | Autonomous Multi-Repo AI Swarm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(180deg, #000000 0%, #0a0e1a 50%, #000814 100%);
            color: #e0e6ed;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #hexCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .content-overlay {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }

        .hero-title {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 100;
            letter-spacing: 0.3em;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 1rem;
            text-shadow: 0 0 40px rgba(0, 229, 255, 0.4);
        }

        .hero-tagline {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            font-weight: 200;
            letter-spacing: 0.15em;
            color: #8fa3b8;
            margin-bottom: 4rem;
            text-transform: lowercase;
        }

        .status-strip {
            display: flex;
            gap: 3rem;
            justify-content: center;
            align-items: center;
            margin-bottom: 4rem;
            flex-wrap: wrap;
            padding: 1.5rem 3rem;
            background: rgba(10, 14, 26, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.15);
            border-radius: 2px;
            backdrop-filter: blur(10px);
        }

        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .status-value {
            font-size: 2rem;
            font-weight: 100;
            color: #00e5ff;
            letter-spacing: 0.1em;
        }

        .status-label {
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: #5a6f85;
            text-transform: uppercase;
        }

        .status-separator {
            width: 1px;
            height: 3rem;
            background: linear-gradient(180deg, transparent, rgba(0, 229, 255, 0.3), transparent);
        }

        .cta-button {
            padding: 1.2rem 3rem;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #ffffff;
            background: transparent;
            border: 1px solid #d4af37;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: inline-block;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.3), transparent);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .cta-button:hover {
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.6),
                        inset 0 0 20px rgba(212, 175, 55, 0.1);
            border-color: #ffd700;
        }

        .cta-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .cta-button span {
            position: relative;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .status-strip {
                gap: 1.5rem;
                padding: 1rem 1.5rem;
            }

            .status-separator {
                display: none;
            }

            .hero-title {
                letter-spacing: 0.2em;
            }
        }

        .pulse {
            animation: subtle-pulse 4s ease-in-out infinite;
        }

        @keyframes subtle-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="hexCanvas"></canvas>
    </div>

    <div class="content-overlay">
        <h1 class="hero-title pulse">HERMES-HIVE</h1>
        <p class="hero-tagline">Autonomous multi-repo AI swarm</p>

        <div class="status-strip">
            <div class="status-item">
                <div class="status-value">4</div>
                <div class="status-label">Repositories</div>
            </div>
            <div class="status-separator"></div>
            <div class="status-item">
                <div class="status-value">9</div>
                <div class="status-label">Agents / Cycle</div>
            </div>
            <div class="status-separator"></div>
            <div class="status-item">
                <div class="status-value">90</div>
                <div class="status-label">Min Heartbeat</div>
            </div>
        </div>

        <button class="cta-button">
            <span>Enter the Hive</span>
        </button>
    </div>

    <script>
        const canvas = document.getElementById('hexCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let rotation = 0;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Hexagon drawing utility
        function drawHexagon(x, y, radius, lineWidth, strokeStyle, fillStyle = null) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i - Math.PI / 2;
                const px = x + radius * Math.cos(angle);
                const py = y + radius * Math.sin(angle);
                if (i === 0) {
                    ctx.moveTo(px, py);
                } else {
                    ctx.lineTo(px, py);
                }
            }
            ctx.closePath();

            if (fillStyle) {
                ctx.fillStyle = fillStyle;
                ctx.fill();
            }

            ctx.strokeStyle = strokeStyle;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
        }

        // Draw hexagonal lattice
        function drawHexagonalLattice(centerX, centerY, cellRadius, rings, rotation) {
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(rotation);

            // Core hexagon (represents the 4 repos core)
            const coreRadius = cellRadius * 1.2;
            drawHexagon(0, 0, coreRadius, 1.5, 'rgba(0, 229, 255, 0.6)');

            // Inner ring - 6 hexagons around center
            const innerRingRadius = cellRadius * 2.3;
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                const x = innerRingRadius * Math.cos(angle);
                const y = innerRingRadius * Math.sin(angle);
                const opacity = 0.4 + 0.1 * Math.sin(Date.now() / 2000 + i);
                drawHexagon(x, y, cellRadius * 0.9, 0.8, `rgba(0, 229, 255, ${opacity})`);
            }

            // Outer ring - 9 agent nodes
            const outerRingRadius = cellRadius * 4;
            for (let i = 0; i < 9; i++) {
                const angle = (Math.PI * 2 / 9) * i;
                const x = outerRingRadius * Math.cos(angle);
                const y = outerRingRadius * Math.sin(angle);
                const opacity = 0.3 + 0.1 * Math.sin(Date.now() / 1800 + i * 0.7);
                drawHexagon(x, y, cellRadius * 0.7, 0.6, `rgba(0, 229, 255, ${opacity})`);
            }

            // Additional architectural hexagons
            const architecturalRingRadius = cellRadius * 5.5;
            for (let i = 0; i < 12; i++) {
                const angle = (Math.PI * 2 / 12) * i;
                const x = architecturalRingRadius * Math.cos(angle);
                const y = architecturalRingRadius * Math.sin(angle);
                const opacity = 0.15 + 0.05 * Math.sin(Date.now() / 2500 + i * 0.5);
                drawHexagon(x, y, cellRadius * 0.5, 0.4, `rgba(0, 229, 255, ${opacity})`);
            }

            // Draw connecting lines between nodes
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.1)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                const x = innerRingRadius * Math.cos(angle);
                const y = innerRingRadius * Math.sin(angle);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(x, y);
                ctx.stroke();
            }

            ctx.restore();
        }

        // Draw the permanent glowing orb
        function drawCentralOrb(x, y, time) {
            const baseRadius = 25;
            const pulseRadius = baseRadius + Math.sin(time / 800) * 8;

            // Outer glow layers
            const gradient1 = ctx.createRadialGradient(x, y, 0, x, y, pulseRadius * 3);
            gradient1.addColorStop(0, 'rgba(0, 229, 255, 0.15)');
            gradient1.addColorStop(0.5, 'rgba(0, 229, 255, 0.05)');
            gradient1.addColorStop(1, 'rgba(0, 229, 255, 0)');
            ctx.fillStyle = gradient1;
            ctx.beginPath();
            ctx.arc(x, y, pulseRadius * 3, 0, Math.PI * 2);
            ctx.fill();

            // Middle glow
            const gradient2 = ctx.createRadialGradient(x, y, 0, x, y, pulseRadius * 1.5);
            gradient2.addColorStop(0, 'rgba(212, 175, 55, 0.4)');
            gradient2.addColorStop(0.5, 'rgba(0, 229, 255, 0.3)');
            gradient2.addColorStop(1, 'rgba(0, 229, 255, 0)');
            ctx.fillStyle = gradient2;
            ctx.beginPath();
            ctx.arc(x, y, pulseRadius * 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Core orb
            const gradient3 = ctx.createRadialGradient(x, y, 0, x, y, pulseRadius);
            gradient3.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
            gradient3.addColorStop(0.3, 'rgba(212, 175, 55, 0.8)');
            gradient3.addColorStop(0.6, 'rgba(0, 229, 255, 0.6)');
            gradient3.addColorStop(1, 'rgba(0, 229, 255, 0.2)');
            ctx.fillStyle = gradient3;
            ctx.beginPath();
            ctx.arc(x, y, pulseRadius, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw smaller drifting orbs
        function drawDriftingOrbs(time) {
            const orbs = [
                { angle: time / 3000, radius: 120, size: 8, color: 'rgba(0, 229, 255, 0.6)' },
                { angle: time / 4000 + Math.PI / 2, radius: 150, size: 6, color: 'rgba(0, 229, 255, 0.5)' },
                { angle: time / 3500 + Math.PI, radius: 100, size: 7, color: 'rgba(212, 175, 55, 0.4)' },
                { angle: time / 4500 + Math.PI * 1.5, radius: 130, size: 5, color: 'rgba(0, 229, 255, 0.4)' }
            ];

            orbs.forEach(orb => {
                const x = centerX + Math.cos(orb.angle) * orb.radius;
                const y = centerY + Math.sin(orb.angle) * orb.radius;

                const gradient = ctx.createRadialGradient(x, y, 0, x, y, orb.size * 3);
                gradient.addColorStop(0, orb.color);
                gradient.addColorStop(0.5, orb.color.replace(/[\d.]+\)$/, '0.2)'));
                gradient.addColorStop(1, 'rgba(0, 229, 255, 0)');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x, y, orb.size * 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = orb.color;
                ctx.beginPath();
                ctx.arc(x, y, orb.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Main animation loop
        function animate() {
            const time = Date.now();

            // Clear canvas with fade effect for motion blur
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            // Draw drifting orbs
            drawDriftingOrbs(time);

            // Draw the hexagonal architecture with rotation
            const cellRadius = Math.min(width, height) / 12;
            rotation += 0.0003; // Slow, continuous rotation
            drawHexagonalLattice(centerX, centerY, cellRadius, 3, rotation);

            // Draw the permanent central orb (always on top, always visible)
            drawCentralOrb(centerX, centerY, time);

            requestAnimationFrame(animate);
        }

        // Start animation
        animate();

        // CTA button interaction
        document.querySelector('.cta-button').addEventListener('click', function() {
            alert('🐝 Welcome to the HERMES-HIVE!\n\nThe swarm dashboard will launch here.\n\nCurrently showing: variant A homepage');
        });
    </script>
</body>
</html>
